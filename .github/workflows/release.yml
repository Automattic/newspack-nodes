name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin zip
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag shape
        id: validate
        # `on.push.tags` is a permissive glob (`v*`); this is the strict
        # gatekeeper. Non-strict tags exit successfully as a no-op.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is a strict release tag — proceeding."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' is not a strict v<major>.<minor>.<patch> tag — skipping release."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.validate.outputs.is_release == 'true'
        uses: actions/checkout@v4

      - name: Setup PHP
        if: steps.validate.outputs.is_release == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        if: steps.validate.outputs.is_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release archive
        if: steps.validate.outputs.is_release == 'true'
        # `npm install` (not `npm ci`): the fork's lockfile drifts from
        # package.json and strict-lockfile mode fails on a fresh clone.
        # `release:archive` (build-release.sh) is the single source of truth for
        # what ships — the same script developers run locally. It builds assets
        # (incl. sync-shared), rsyncs via .distignore, installs production-only
        # vendor, and zips.
        run: |
          npm install
          npm run release:archive

      - name: Extract changelog notes
        if: steps.validate.outputs.is_release == 'true'
        # Use the CHANGELOG section for this version as the release body, so the
        # published notes match the curated changelog rather than autogenerated
        # commit lists. GITHUB_REF_NAME is the built-in tag name (e.g. v0.2.9).
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "No CHANGELOG.md section for ${version}; see CHANGELOG.md." > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        if: steps.validate.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release/newspack-nodes.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
