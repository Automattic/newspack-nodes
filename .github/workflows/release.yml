name: Release

on:
  push:
    tags:
      - 'v*'

# The build runs this repository's code with a read-only token; only the
# release job, which checks out and runs none of it, can write.
jobs:
  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_release: ${{ steps.validate.outputs.is_release }}
    steps:
      - name: Validate tag shape
        id: validate
        # `on.push.tags` is a permissive glob (`v*`); this is the strict
        # gatekeeper. Non-strict tags exit successfully as a no-op.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is a strict release tag — proceeding."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$TAG' is not a strict v<major>.<minor>.<patch> tag — skipping release."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.validate.outputs.is_release == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        if: steps.validate.outputs.is_release == 'true'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        if: steps.validate.outputs.is_release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build release archive
        if: steps.validate.outputs.is_release == 'true'
        # npm ci: reproducible install from the committed lock; release:archive (build-release.sh) is the single source of truth for what ships.
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run release:archive

      - name: Extract changelog notes
        if: steps.validate.outputs.is_release == 'true'
        # Use the CHANGELOG section for this version as the release body, so the
        # published notes match the curated changelog rather than autogenerated
        # commit lists. GITHUB_REF_NAME is the built-in tag name (e.g. v0.2.9).
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "No CHANGELOG.md section for ${version}; see CHANGELOG.md." > RELEASE_NOTES.md
          fi

      - name: Upload release files
        if: steps.validate.outputs.is_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release/*.zip
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release plugin zip
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
